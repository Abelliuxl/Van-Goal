[workspace]
resolver = "2"
members = ["crates/core", "crates/desktop", "crates/mobile"]

# Shared by every member, so `env!("CARGO_PKG_VERSION")` — which the OpenClaw
# handshake reports to the Gateway — is the same number whichever crate it is
# compiled into.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Abelliuxl/Van-Goal"

[workspace.dependencies]
# UI, desktop only.
gpui = "0.2.2"
rfd = "0.15"

# Async runtime for backend transports (HTTP, WebSocket, SSE, subprocesses).
tokio = { version = "1.47", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "process",
    "io-util",
    "net",
    "time",
] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
anyhow = "1"

uuid = { version = "1", features = ["v4"] }
regex = "1"
unicode-segmentation = "1"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde", "clock"] }

[profile.release]
opt-level = 2
strip = true
lto = "thin"
