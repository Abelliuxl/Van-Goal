name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Ensure SDKROOT
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Build (debug)
        run: cargo build --workspace

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: desktop/go.sum

      - name: Desktop window (vet, test)
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

  build-windows:
    name: Build Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      # The debug build is what the Go tests load (target/debug); the release
      # one is what the packaging script ships.
      - name: Build desktop core
        run: |
          cargo build -p van-goal-desktop
          cargo build --release -p van-goal-desktop

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: desktop/go.sum

      # Formatting is checked by the macOS job, where the checkout keeps LF;
      # actions/checkout converts to CRLF on Windows and gofmt would flag
      # every file.
      - name: Desktop window (vet, test)
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

      - name: Package the app
        run: ./Scripts/package_windows.ps1
