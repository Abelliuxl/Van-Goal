name: van_goal
description: "Van-Goal — a client for local and remote coding agents."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Talking to libvan_goal_mobile.so, and to `Utf8` for the string marshalling.
  ffi: ^2.1.3
  # The private directory Android gives the app, handed to the Rust side so it
  # keeps its settings and session cache somewhere it is allowed to write.
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
