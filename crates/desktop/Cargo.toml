[package]
name = "van-goal-desktop"
description = "C ABI over van-goal-core for the MyGo desktop client: owns the connection, the session state machine and the message list, so the Go side only draws."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "van_goal_desktop"
# `cdylib` is what the Go client loads (libvan_goal_desktop.dylib / .dll);
# `lib` keeps the crate usable from Rust tests.
crate-type = ["cdylib", "lib"]

[dependencies]
van-goal-core = { path = "../core" }

tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
# See the `testing` feature in crates/core: it keeps the test suite off the
# developer's real app-data directory.
van-goal-core = { path = "../core", features = ["testing"] }
